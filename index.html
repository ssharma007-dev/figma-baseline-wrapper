<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Figma design</title>
<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; }
  #design { position: relative; }
  #design > img { display: block; user-select: none; -webkit-user-select: none; }
  /* Figma DOM layer: real positions, sizes and text from Figma, drawn invisibly over the image */
  .fg { position: absolute; margin: 0; padding: 0; border: 0; background: transparent; color: transparent;
        overflow: hidden; white-space: pre-wrap; box-sizing: border-box; pointer-events: auto; user-select: text; -webkit-user-select: text; cursor: text; font: inherit; }
  /* Text mode: the design drawn by the browser, with visible text */
  .fv { position: absolute; margin: 0; padding: 0; border: 0; background: transparent; box-sizing: border-box; color: #000000;
        font: inherit; font-kerning: normal; overflow: visible; text-rendering: auto; -webkit-font-smoothing: antialiased; }
  img.fv { display: block; object-fit: fill; }
  html[data-figma-mode] #design { visibility: hidden; }
  html[data-figma-mode][data-figma-dom="ready"] #design { visibility: visible; }
  /* Hybrid mode: Figma's image is painted over the browser-drawn elements. It is a CSS layer, not an element,
     so the DOM holds only the design's own elements. */
  html[data-figma-mode="hybrid"] #design::after { content: ""; position: absolute; inset: 0; z-index: 2147483647;
        pointer-events: none; background: var(--figma-image) 0 0 / 100% 100% no-repeat; }
  /* Text stays invisible, but a selection shows so you can check it is there */
  .fg::selection { background: rgba(79, 70, 229, .3); }
</style>
</head>
<body>
  <!-- Usage: /?img=<Figma image link>#dom=<v2 elements>       (hybrid: Figma's image on screen, browser-drawn elements as DOM; made by /make/)
              /?img=<Figma image link>                       (round 1: design image only)
              /?img=<Figma image link>#dom=<packed nodes>    (round 2: design image + Figma DOM; made by /make/)
              /#dom=<packed nodes>                          (text mode: the browser draws the design and its text; made by /make/)
       Shows the design at actual size (1x) with no margins, so Chrome doesn't shrink it or add a dark background. -->
  <div id="design"><img id="img" alt="Figma design" draggable="false"></div>
  <script type="module">
    import { decodeDom, renderDom, renderVisible } from './figma-dom.js?v=4'
    const src = new URLSearchParams(location.search).get('img')
    const packed = new URLSearchParams(location.hash.slice(1)).get('dom')
    const design = document.getElementById('design')
    const tree = packed && await decodeDom(packed)
    const httpsSrc = src && /^https:\/\//i.test(src) ? new URL(src).href : null
    if (tree?.v === 2) {
      const hybrid = !!httpsSrc
      document.documentElement.dataset.figmaMode = hybrid ? 'hybrid' : 'text'
      document.getElementById('img').remove()
      Object.assign(design.style, { width: tree.b[2] + 'px', height: tree.b[3] + 'px' })
      const waits = [renderVisible(tree, design, { iconsAsImages: hybrid })]
      if (hybrid) {
        design.style.setProperty('--figma-image', `url("${httpsSrc.replace(/["\\]/g, encodeURIComponent)}")`)
        const pic = new Image(); pic.src = httpsSrc
        waits.push(pic.decode().catch(() => {}))
      }
      await Promise.all(waits)
      document.documentElement.dataset.figmaDom = 'ready'
    } else if (!src) {
      document.body.textContent = 'Add ?img=<Figma image link> to the address, or create a link at /make/.'
    } else {
      document.getElementById('img').src = src
      if (tree) {
        Object.assign(design.style, { width: tree.b[2] + 'px', height: tree.b[3] + 'px' })
        renderDom(tree, design)
        document.documentElement.dataset.figmaDom = 'ready'
      }
    }
  </script>
</body>
</html>
